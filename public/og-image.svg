<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Digital Craft — чат-боты и веб-приложения">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5efc" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#6d5efc" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6d5efc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.95" r="0.7">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#05070d" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Логотип -->
  <g transform="translate(80, 74)">
    <rect width="60" height="60" rx="16" fill="url(#brand)" />
    <path d="M30 15l15 8-15 8-15-8 15-8z" fill="#05070d" fill-opacity="0.85" />
    <path d="M15 30l15 8 15-8" fill="none" stroke="#05070d" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="160" y="102" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.4">Digital Craft</text>
  <text x="160" y="130" fill="#7f89a6" font-family="Inter, Arial, sans-serif" font-size="16">боты · веб-приложения</text>

  <text x="80" y="290" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.6">Чат-боты Telegram и MAX</text>
  <text x="80" y="366" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.6">и веб-приложения для бизнеса</text>

  <text x="80" y="430" fill="#b6bed6" font-family="Inter, Arial, sans-serif" font-size="24">От аналитики и прототипа до продакшена и поддержки — под ключ.</text>

  <g transform="translate(80, 480)">
    <rect width="290" height="62" rx="31" fill="url(#brand)" />
    <text x="145" y="40" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Заказать проект</text>
  </g>
  <g transform="translate(392, 480)">
    <rect width="230" height="62" rx="31" fill="none" stroke="#ffffff" stroke-opacity="0.18" />
    <text x="115" y="40" text-anchor="middle" fill="#f2f5ff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Кейсы и цены</text>
  </g>
</svg>
